[package]
name = "sl3-client"
version.workspace = true
edition.workspace = true

[features]
default = ["audio"]
audio = ["dep:rodio"]

[dependencies]
sl3-shared = { path = "../shared" }
serde = { workspace = true }
bincode = { workspace = true }
glam = { workspace = true }
log = "0.4"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
wgpu = "22"
winit = "0.30"
rodio = { version = "0.19", optional = true }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"

[dev-dependencies]
# Même version que wgpu 22 -> déjà compilé ; valide les shaders WGSL sans GPU.
naga = { version = "22.1", features = ["wgsl-in"] }
